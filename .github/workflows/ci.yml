name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dawa24
          POSTGRES_PASSWORD: dawa24
          POSTGRES_DB: dawa24_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawa24 -d dawa24_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Format check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Check AI Provider Isolation
        run: |
          echo "Checking provider isolation..."
          if grep -riE '\b(openai|anthropic|deepseek|gemini|groq|openrouter)\b' \
               --include='*.go' --include='*.templ' --include='*.sql' \
               ./cmd ./internal ./db 2>/dev/null \
               | grep -v '^./internal/platform/gateway/' \
               | grep -v '_test.go'; then
            echo "ERROR: AI provider names found outside internal/platform/gateway/."
            exit 1
          fi
          echo "ok: no provider names outside gateway package"

      - name: Check Go File Sizes (<= 400 lines)
        run: |
          echo "Checking file sizes..."
          fail=0
          while read -r count file; do
            if [ "$count" -gt 400 ]; then
              echo "  $file: $count lines (limit 400)"
              fail=1
            fi
          done < <(find ./cmd ./internal ./test -name '*.go' -not -name '*_templ.go' -exec wc -l {} + | grep -v ' total$')
          if [ "$fail" = "1" ]; then
            echo "ERROR: files exceed 400-line ceiling."
            exit 1
          fi
          echo "ok: all Go files within limit"

      - name: Run Migrations
        env:
          DATABASE_URL: postgres://dawa24:dawa24@localhost:5432/dawa24_store?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          go run ./cmd/cli migrate
          go run ./cmd/cli migrate-status

      - name: Run Tests (with race detector & coverage)
        env:
          DATABASE_URL: postgres://dawa24:dawa24@localhost:5432/dawa24_store?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: go test -v -race -cover -count=1 ./...

      - name: Enforce Coverage Floor
        env:
          DATABASE_URL: postgres://dawa24:dawa24@localhost:5432/dawa24_store?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          go test -coverprofile=coverage.out -count=1 ./...
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if awk "BEGIN{exit !(${total} < 1.0)}"; then
            echo "ERROR: total coverage is effectively zero (${total}%)."
            exit 1
          fi

      - name: Build All 5 Production Binaries
        run: |
          go build -trimpath -o bin/server ./cmd/server
          go build -trimpath -o bin/worker ./cmd/worker
          go build -trimpath -o bin/cli ./cmd/cli
          go build -trimpath -o bin/etl ./cmd/etl
          go build -trimpath -o bin/dbcheck ./cmd/dbcheck
