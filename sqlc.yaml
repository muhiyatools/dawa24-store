version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "postgres"
        out: "internal/modules"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "numeric"
            go_type: "github.com/muhiya/dawa24-store/internal/shared/money.Amount"
          - db_type: "citext"
            go_type: "string"
          - column: "identity.users.name"
            go_type: "github.com/muhiya/dawa24-store/internal/shared/i18n.Text"
          - column: "identity.roles.name"
            go_type: "github.com/muhiya/dawa24-store/internal/shared/i18n.Text"
          - column: "identity.permissions.name"
            go_type: "github.com/muhiya/dawa24-store/internal/shared/i18n.Text"
          - column: "org.organizations.name"
            go_type: "github.com/muhiya/dawa24-store/internal/shared/i18n.Text"
          - column: "org.organizations.description"
            go_type: "github.com/muhiya/dawa24-store/internal/shared/i18n.Text"
          - column: "org.branches.name"
            go_type: "github.com/muhiya/dawa24-store/internal/shared/i18n.Text"
