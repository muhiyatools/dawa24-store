# =============================================================================
# Dawa24 Store — Production Hardened TLS Reverse Proxy (Nginx)
# Target: SSL Labs Grade A+ (100% Forward Secrecy, PQC Key Exchange, Zero Weak Ciphers)
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=dawa24_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=dawa24_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=dawa24_csp:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Redirect all plaintext HTTP to HTTPS with 301 Permanent Redirect
    return 301 https://$host$request_uri;
}

server {
    # Default HTTPS listener with SNI fallback
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # HTTP/2 support
    http2 on;

    server_name dawa24.com *.dawa24.com; # Replace with your real domain

    # SSL Certificates (managed via Let's Encrypt / Certbot / Elest.io)
    ssl_certificate /etc/letsencrypt/live/dawa24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dawa24.com/privkey.pem;

    # -------------------------------------------------------------------------
    # Strict Modern TLS Protocols (TLSv1.2 & TLSv1.3 ONLY)
    # Drops legacy SSLv2, SSLv3, TLSv1.0, and TLSv1.1
    # -------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;

    # -------------------------------------------------------------------------
    # Server Preference Order
    # Enforces server cipher selection over client preferences
    # -------------------------------------------------------------------------
    ssl_prefer_server_ciphers on;

    # -------------------------------------------------------------------------
    # Forward Secrecy (PFS) & AEAD-Only Cipher Suites
    # ZERO static RSA key exchange (no TLS_RSA_*).
    # ZERO CBC-mode ciphers (no BEAST/Lucky13/Padding Oracle).
    # ZERO weak 3DES, ARIA, CCM, or RC4 ciphers.
    # -------------------------------------------------------------------------
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # -------------------------------------------------------------------------
    # Post-Quantum Cryptography (PQC) Hybrid Curves
    # Supported by OpenSSL 3.2+ (X25519MLKEM768 or X25519Kyber768Draft00)
    # -------------------------------------------------------------------------
    ssl_ecdh_curve X25519MLKEM768:X25519Kyber768Draft00:X25519:prime256v1:secp384r1;

    # -------------------------------------------------------------------------
    # Session Caching & Tickets
    # -------------------------------------------------------------------------
    ssl_session_cache shared:Dawa24SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off; # Prevents forward secrecy compromise via stolen ticket keys

    # -------------------------------------------------------------------------
    # OCSP Stapling (accelerates client handshake and verifies revocation)
    # -------------------------------------------------------------------------
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/dawa24.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Strict Transport Security (HSTS) with Subdomains and Preload
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # -------------------------------------------------------------------------
    # Proxying to Dawa24 Go Modular Monolith (172.17.0.1:8070)
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=dawa24_general burst=50 nodelay;

        proxy_pass http://172.17.0.1:8070;
        proxy_http_version 1.1;

        # WebSocket and Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streams
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Dedicated rate limiting for CSP reporting
    location /api/v1/csp-report {
        limit_req zone=dawa24_csp burst=10 nodelay;
        proxy_pass http://172.17.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
