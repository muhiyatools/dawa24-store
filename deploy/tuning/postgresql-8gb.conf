# =============================================================================
# PostgreSQL 18 Production Tuning for 2 vCPU / 8 GB RAM VPS (Hostinger KVM 4)
# =============================================================================
# Scaled profile supporting 5,000+ active users with 450+ sustained RPS
# =============================================================================

# Memory Configuration
shared_buffers = 2GB                   # 25% of total 8 GB RAM
effective_cache_size = 5GB             # ~60% of total RAM for OS page cache
work_mem = 16MB                        # Ample memory for multi-column sorts and hash joins
maintenance_work_mem = 256MB           # High-speed maintenance and re-indexing
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9     # Smooth checkpoints
wal_buffers = 32MB

# Query Planner & Storage Cost
random_page_cost = 1.1                 # NVMe SSDs
effective_io_concurrency = 200
default_statistics_target = 100

# Concurrency & Connections
max_connections = 100                  # Max client connections
statement_timeout = 30000              # 30s statement ceiling
idle_in_transaction_session_timeout = 15000 # 15s lock ceiling

# Observability & Monitoring
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
log_min_duration_statement = 500       # Log slow queries > 500ms
