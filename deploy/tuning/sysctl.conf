# =============================================================================
# Linux Kernel Network & Memory Tuning (/etc/sysctl.d/99-dawa24-high-concurrency.conf)
# =============================================================================
# Applies to Netcup / Hostinger KVM VPS to eliminate socket bottlenecks and OOMs
# =============================================================================

# Virtual Memory: avoid thrashing into swap while preventing random OOM kills
vm.swappiness = 10
vm.overcommit_memory = 1
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# Socket Backlogs: handle massive bursts of simultaneous TCP handshakes
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.core.netdev_max_backlog = 4096

# Fast Socket Recycling & Timeouts
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Ephemeral Port Range Expansion (prevents socket exhaustion on high concurrency)
net.ipv4.ip_local_port_range = 10240 65535

# TCP Buffer Autosizing
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
