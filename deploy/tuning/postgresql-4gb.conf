# =============================================================================
# PostgreSQL 18 Production Tuning for 2 vCPU / 4 GB RAM VPS (Netcup / Elest.io)
# =============================================================================
# Tailored for shared VPS running App Monolith + Worker + PostgreSQL + Redis
# =============================================================================

# Memory Configuration
shared_buffers = 768MB                 # 20-25% of total 4 GB RAM
effective_cache_size = 2GB             # 50% of 4 GB RAM available for OS disk cache
work_mem = 8MB                         # Avoid sort spills on trigram indexes without OOM risk
maintenance_work_mem = 128MB           # Accelerates CREATE INDEX and VACUUM
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9     # Spreads checkpoint I/O over time
wal_buffers = 16MB

# Query Planner & Storage Cost
random_page_cost = 1.1                 # NVMe / SSD storage (default 4.0 was for HDDs)
effective_io_concurrency = 200         # Concurrent NVMe I/O requests
default_statistics_target = 100

# Concurrency & Connections
max_connections = 60                   # Bounded pool prevents process-context thrashing on 2 cores
statement_timeout = 30000              # 30s statement timeout prevents pool saturation
idle_in_transaction_session_timeout = 15000 # 15s prevents leaked transaction locks

# Observability & Monitoring
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
log_min_duration_statement = 500       # Log any query taking > 500ms
