<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دواء 24 - منصة التوريد الدوائي الذكية</title>
  <meta name="description" content="منصة ربط الصيدليات بمخازن وشركات الأدوية - طلب مباشر، فواتير إلكترونية، وأسعار فورية.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <span>💊 دواء 24</span>
        <span class="brand-badge">سوق الجملة</span>
      </a>

      <div class="search-box-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="ابحث بالاسم التجاري، العلمي، أو الشركة المصنعة...">
      </div>

      <div class="nav-actions">
        <button class="nav-tab-btn active">الكتالوج الدوائي</button>
        <button class="nav-tab-btn">العروض والرعايات</button>
        <button class="nav-tab-btn">طلباتي</button>
        <button class="cart-btn" onclick="toggleCartDrawer(true)">
          <span>سلة الطلب</span>
          <span id="cart-counter" class="cart-counter">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Hero Spotlight -->
    <div class="banner-spotlight">
      <div class="banner-text">
        <h2>منظومة التوريد الدوائي الموحدة للمخازن والصيدليات</h2>
        <p>ربط فوري للمخزون، خصومات إضافية لحظية، وتسوية مالية دقيقة لكل صيدلية ومورد.</p>
      </div>
      <div style="font-size: 3.5rem;">📦</div>
    </div>

    <!-- Catalog Section -->
    <div class="section-header">
      <h2 class="section-title">الأدوية والمستحضرات المتوفرة بالمخازن</h2>
      <div style="font-size: 0.9rem; color: var(--text-muted);">تحديث لحظي للمخزون والخصومات</div>
    </div>

    <div id="products-grid" class="products-grid">
      <!-- Injected via JavaScript -->
    </div>

  </main>

  <!-- Cart & Checkout Drawer -->
  <div id="cart-drawer" class="drawer-overlay" onclick="if(event.target === this) toggleCartDrawer(false)">
    <div class="drawer-panel">
      <div class="drawer-header">
        <h3 class="drawer-title">محتويات سلة الطلب</h3>
        <button class="btn-close" onclick="toggleCartDrawer(false)">✕</button>
      </div>

      <div id="cart-items-list" class="cart-items-list">
        <!-- Injected via JS -->
      </div>

      <div class="drawer-footer">
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem;">
          <span style="font-size: 1.1rem; font-weight: 700;">الإجمالي الكلي:</span>
          <span id="cart-total" style="font-size: 1.35rem; font-weight: 800; color: var(--primary);">0.00 ج.م</span>
        </div>
        <button class="checkout-btn" onclick="executeCheckout()">تأكيد وإرسال أمر الشراء</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
