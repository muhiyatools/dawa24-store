# =============================================================================
# Dawa24 Store - Production Docker Compose for Traefik Ingress (Hostinger / Elestio)
# =============================================================================
# Automatically connects to the existing PostgreSQL database on postgresql-psr0_default,
# seeds reference data, creates the Super Admin account, and routes HTTPS traffic 
# through Traefik with automated Let's Encrypt SSL.
# =============================================================================

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
        COMMIT: ${COMMIT:-unknown}
        BUILDKIT_INLINE_CACHE: "1"
    command: ["/app/cli", "migrate"]
    restart: "no"
    environment:
      - APP_ENV=${APP_ENV:-prod}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dawa24_secret_postgres_pw}@postgresql:5432/${POSTGRES_DB:-postgres}?sslmode=disable}
      - DATA_DIR=/app/data
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@dawa24.net}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin!Dawa24!2026}
    volumes:
      - dawa24-data:/app/data
    networks:
      - postgresql-psr0_default

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
        COMMIT: ${COMMIT:-unknown}
        BUILDKIT_INLINE_CACHE: "1"
    command: ["/app/server"]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.dawa24.rule=Host(`test.dawa24.com`) || Host(`dawa24.com`) || Host(`srv1986270.hstgr.cloud`)
      - traefik.http.routers.dawa24.entrypoints=web,websecure
      - traefik.http.routers.dawa24.tls.certresolver=letsencrypt
      - traefik.http.services.dawa24.loadbalancer.server.port=8070
    ports:
      - "8070"
    environment:
      - APP_ENV=${APP_ENV:-prod}
      - APP_NAME=${APP_NAME:-Dawa24}
      - APP_BASE_URL=${APP_BASE_URL:-https://test.dawa24.com}
      - PORT=8070
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dawa24_secret_postgres_pw}@postgresql:5432/${POSTGRES_DB:-postgres}?sslmode=disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dawa24_secret_redis_pw}@redis:6379/0
      - DB_MAX_CONNS=${DB_MAX_CONNS:-25}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-2}
      - DB_STATEMENT_TIMEOUT=30s
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET:-9f8b7c6d5e4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c}
      - SESSION_COOKIE_NAME=dawa24_session
      - SESSION_TTL=720h
      - SESSION_SECURE=true
      - GOMEMLIMIT=1400MiB
      - GOMAXPROCS=2
      - GATEWAY_ENABLED=${GATEWAY_ENABLED:-false}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-https://api.muhiya.com}
      - GATEWAY_VIRTUAL_KEY=${GATEWAY_VIRTUAL_KEY:-}
      - GATEWAY_CLIENT_APP=dawa24-store
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - TRACE_SAMPLING=0.05
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-starttls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@dawa24.net}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Dawa24 | دوا 24}
    volumes:
      - dawa24-data:/app/data
    networks:
      - postgresql-psr0_default
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
        COMMIT: ${COMMIT:-unknown}
        BUILDKIT_INLINE_CACHE: "1"
    command: ["/app/worker"]
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-prod}
      - APP_NAME=${APP_NAME:-Dawa24}
      - APP_BASE_URL=${APP_BASE_URL:-https://test.dawa24.com}
      - PORT=8070
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dawa24_secret_postgres_pw}@postgresql:5432/${POSTGRES_DB:-postgres}?sslmode=disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dawa24_secret_redis_pw}@redis:6379/0
      - DB_MAX_CONNS=${DB_MAX_CONNS:-25}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-2}
      - DB_STATEMENT_TIMEOUT=30s
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET:-9f8b7c6d5e4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c}
      - GOMEMLIMIT=700MiB
      - GOMAXPROCS=1
      - WORKER_IMPORTS=2
      - WORKER_AI=2
      - WORKER_NOTIFICATIONS=4
      - WORKER_PROJECTIONS=2
      - WORKER_MAINTENANCE=1
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-starttls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@dawa24.net}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Dawa24 | دوا 24}
    volumes:
      - dawa24-data:/app/data
    networks:
      - postgresql-psr0_default
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: dawa24-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dawa24_secret_redis_pw}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - postgresql-psr0_default

networks:
  postgresql-psr0_default:
    external: true

volumes:
  dawa24-data:
  redis-data:
