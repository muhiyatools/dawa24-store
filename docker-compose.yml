# =============================================================================
# Dawa24 Store — deployment compose (Elest.io reads this file)
# =============================================================================
#
# Three containers from ONE image, built once from the Dockerfile:
#
#   migrate  runs to completion, then exits      -> schema is current
#   server   HTTP, published on host 8070        -> depends on migrate succeeding
#   worker   River background jobs               -> depends on migrate succeeding
#
# Why a compose file and not just a Dockerfile: the Dockerfile says how to build
# the image; this says what to run. Without it, Elest.io generates a single
# "app" service that starts the server and never applies migrations — the server
# then boots, reports itself unready, and refuses traffic forever.
#
# Why migrations are their own container: N server replicas starting together
# would race to migrate, and a migration failure would surface as a crash loop
# instead of a failed step with a readable log. See docs/adr/decisions.md ADR 0004.
#
# Local development uses docker-compose.dev.yml instead (postgres/redis/minio).

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-prod}
  APP_NAME: Dawa24
  APP_BASE_URL: ${APP_BASE_URL}

  # Full connection URIs, set in the Elest.io environment panel. They are single
  # variables rather than host/port/password parts because the database and
  # Redis live on separate services with different hosts and non-default ports.
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}

  DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}

  # Object storage. Not yet used by any code path; required only from Phase 5.
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-dawa24}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
  STORAGE_USE_PATH_STYLE: ${STORAGE_USE_PATH_STYLE:-true}
  STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}

  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dawa24_session}
  SESSION_TTL: ${SESSION_TTL:-720h}
  SESSION_SECURE: ${SESSION_SECURE:-true}

  # AI Gateway. Leave GATEWAY_ENABLED=false until a virtual key is issued —
  # every AI capability has a deterministic fallback, so this is a supported
  # configuration and not a degraded one.
  GATEWAY_ENABLED: ${GATEWAY_ENABLED:-false}
  GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-https://api.muhiya.com}
  GATEWAY_VIRTUAL_KEY: ${GATEWAY_VIRTUAL_KEY:-}
  GATEWAY_CLIENT_APP: ${GATEWAY_CLIENT_APP:-dawa24-store}
  GATEWAY_TIMEOUT: ${GATEWAY_TIMEOUT:-60s}

  # Google Maps Embed API. Optional; without a key the location picker renders a
  # coordinate-entry fallback (Google blocks framing maps.google.com without the
  # official Embed API). The key is browser-public — restrict it by HTTP
  # referrer in Google Cloud Console.
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  TRACE_SAMPLING: ${TRACE_SAMPLING:-0.05}

x-build: &build
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-unknown}

services:
  migrate:
    <<: *build
    image: dawa24-store:local
    command: ["/app/cli", "migrate"]
    environment: *app-env
    restart: "no"

  server:
    <<: *build
    image: dawa24-store:local
    command: ["/app/server"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Host 8070, not 8080: 8080 belongs to another project on this host.
      # The Elest.io reverse proxy target MUST be 172.17.0.1:8070 to match.
      - "172.17.0.1:8070:8070"
    environment:
      <<: *app-env
      PORT: "8070"
    healthcheck:
      # Liveness only — deliberately dependency-free, so a brief database blip
      # does not restart a healthy container and turn an outage into a crash
      # loop. Readiness (/ready) additionally checks dependencies and pending
      # migrations; that is what the reverse proxy should poll.
      test: ["CMD", "curl", "-fsS", "http://localhost:8070/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  worker:
    <<: *build
    image: dawa24-store:local
    command: ["/app/worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_IMPORTS: ${WORKER_IMPORTS:-2}
      WORKER_AI: ${WORKER_AI:-4}
      WORKER_NOTIFICATIONS: ${WORKER_NOTIFICATIONS:-4}
      WORKER_PROJECTIONS: ${WORKER_PROJECTIONS:-2}
      WORKER_MAINTENANCE: ${WORKER_MAINTENANCE:-1}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-60s}
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
